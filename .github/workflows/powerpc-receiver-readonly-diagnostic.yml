name: PowerPC fresh-origin receipt diagnostic

on:
  push:
    paths:
      - ".github/workflows/powerpc-receiver-readonly-diagnostic.yml"

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install crypto dependency
        run: python3 -m pip install --disable-pip-version-check --quiet cryptography

      - name: Issue and inspect fresh runtime_health receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PowerPC Control Acceptance"
          git config user.email "61332783+Christopher-Charman@users.noreply.github.com"

          ID=/tmp/identity.json
          TASK=/tmp/task.json
          CTX=/tmp/task.context.json
          RESULT=/tmp/result.json
          RECEIPT=/tmp/receipt.json
          CLIENT=bootstrap-relay/permanent-control/origin-client.py
          QUEUE=bootstrap-relay/permanent-control/queue.json

          curl -fsSL --connect-timeout 8 --max-time 20 \
            -H 'Cache-Control: no-cache' \
            "https://www.powerpc-darwin.org/static/ppc-control-identity-live.json?accept=$(date +%s%N)" \
            -o "$ID"

          OUT="$(python3 "$CLIENT" prepare \
            --identity "$ID" \
            --tool runtime_health \
            --arguments '{}' \
            --authority read_only \
            --ttl 900 \
            --output "$TASK" \
            --context "$CTX")"
          TASK_ID="$(printf '%s\n' "$OUT" | sed -n 's/^TASK_PREPARED=//p' | tail -n1)"
          FP="$(printf '%s\n' "$OUT" | sed -n 's/^IDENTITY_FINGERPRINT=//p' | tail -n1)"
          test -n "$TASK_ID"
          test -n "$FP"
          echo "::add-mask::$FP"
          echo "TASK_ID=$TASK_ID"

          python3 - "$QUEUE" "$TASK" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]))
          t=json.load(open(sys.argv[2]))
          q.setdefault("tasks",[]).append(t)
          with open(sys.argv[1],"w") as f:
              json.dump(q,f,separators=(",",":"),sort_keys=True); f.write("\n")
          PY
          git add "$QUEUE"
          git commit -m "control: diagnostic runtime health acceptance [skip ci]"
          for n in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            test "$n" -lt 3
            git fetch origin main
            git rebase origin/main
          done

          URL="https://www.powerpc-darwin.org/static/ppc-control-result-$TASK_ID.json"
          ok=0
          for i in $(seq 1 60); do
            code="$(curl -sS -o "$RESULT" -w '%{http_code}' \
              --connect-timeout 8 --max-time 15 -H 'Cache-Control: no-cache' \
              "$URL?accept=$(date +%s%N)" || true)"
            if [ "$code" = 200 ] && python3 - "$RESULT" "$TASK_ID" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get("protocol")=="powerpc-control-v1"
          assert d.get("version")==1
          assert d.get("task_id")==sys.argv[2]
          assert d.get("kind")=="result"
          PY
            then ok=1; break; fi
            sleep 2
          done

          if [ "$ok" = 1 ]; then
            python3 "$CLIENT" decode --result "$RESULT" --context "$CTX" --output "$RECEIPT" >/dev/null
            python3 - "$RECEIPT" "$TASK_ID" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          r=d.get("result") or {}
          text="\n".join(x.get("text","") for x in (r.get("content") or []) if isinstance(x,dict))[:1500]
          print("RECEIPT_TASK_ID="+str(d.get("task_id")))
          print("RECEIPT_COMPLETION_STATE="+str(d.get("completion_state")))
          print("RECEIPT_UNRESOLVED="+json.dumps(d.get("unresolved") or []))
          print("RECEIPT_ACTION_COUNT="+str(len(d.get("actions") or [])))
          print("RECEIPT_RESULT_ISERROR="+str(r.get("isError")))
          print("RECEIPT_RESULT_TEXT="+text.replace("\n"," | "))
          ex=d.get("executor_identity") or {}
          print("RECEIPT_EXECUTOR="+json.dumps({
              "runtime_id":ex.get("runtime_id"),"user":ex.get("user"),
              "uid":ex.get("uid"),"hostname":ex.get("hostname")
          },sort_keys=True))
          rr=d.get("runtime_receipt") or {}
          print("RECEIPT_RUNTIME="+json.dumps({
              "namespace":rr.get("namespace"),"webapp":rr.get("webapp"),
              "local_mcp":rr.get("local_mcp")
          },sort_keys=True))
          good=(
              d.get("task_id")==sys.argv[2] and
              d.get("completion_state")=="COMPLETED" and
              ex.get("runtime_id")=="fasthost.powerpc" and
              ex.get("uid")==2257347 and
              (d.get("unresolved") or [])==[] and
              r.get("isError") is not True
          )
          open("/tmp/accept-good","w").write("1" if good else "0")
          PY
          else
            echo RECEIPT_RETRIEVAL=TIMEOUT
            echo 0 > /tmp/accept-good
          fi

          # Cleanup this task regardless of pass/fail.
          git fetch origin main
          git reset --hard origin/main
          python3 - "$QUEUE" "$TASK_ID" <<'PY'
          import json,sys
          p,tid=sys.argv[1],sys.argv[2]
          q=json.load(open(p))
          q["tasks"]=[t for t in q.get("tasks",[]) if t.get("task_id")!=tid]
          with open(p,"w") as f:
              json.dump(q,f,separators=(",",":"),sort_keys=True); f.write("\n")
          PY
          if ! git diff --quiet -- "$QUEUE"; then
            git add "$QUEUE"
            git commit -m "control: remove diagnostic acceptance task [skip ci]"
            for n in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$n" -lt 3
              git fetch origin main
              git rebase origin/main
            done
          fi

          test "$(cat /tmp/accept-good)" = 1
          echo FRESH_ORIGIN_RUNTIME_HEALTH=PASS
          echo SIGNED_RESULT_SIGNATURE_AND_DECRYPTION=PASS
          echo PERMANENT_ACCESS_EGRESS_CRYPTO_ACCEPTANCE=PASS
