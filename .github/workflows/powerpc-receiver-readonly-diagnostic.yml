name: PowerPC receiver external path diagnostic

on:
  push:
    paths:
      - ".github/workflows/powerpc-receiver-readonly-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe queue propagation and public flat egress
        shell: bash
        run: |
          set -euo pipefail
          echo PPC_EXTERNAL_DIAG_BEGIN
          date -u

          QURL="https://raw.githubusercontent.com/Christopher-Charman/open-webui/main/bootstrap-relay/permanent-control/queue.json"
          curl -fsSL -H 'Cache-Control: no-cache' "$QURL?diag=$(date +%s%N)" -o /tmp/q.json
          echo ===QUEUE_TASKS===
          python3 - <<'PY'
          import json
          q=json.load(open('/tmp/q.json'))
          for t in q.get('tasks',[]):
              print(t.get('task_id',''))
          PY

          probe() {
            label="$1"
            url="$2"
            out="/tmp/$label.out"
            code="$(curl -sS -D "/tmp/$label.headers" -o "$out" -w '%{http_code}' \
              --connect-timeout 8 --max-time 20 \
              -H 'Cache-Control: no-cache' "$url" || true)"
            echo "===${label}==="
            echo "HTTP=$code"
            sed -n '1,25p' "/tmp/$label.headers" || true
            head -c 2048 "$out" || true
            echo
          }

          stamp="$(date +%s%N)"
          probe STATUS "https://www.powerpc-darwin.org/static/ppc-control-status-live.json?diag=$stamp"
          probe IDENTITY "https://www.powerpc-darwin.org/static/ppc-control-identity-live.json?diag=$stamp"
          probe POSTDEPLOY "https://www.powerpc-darwin.org/static/ppc-control-result-ppc-flat-postdeploy-health-1790769474.json?diag=$stamp"
          probe MARKER "https://www.powerpc-darwin.org/static/ppc-control-runtime-probe-1790769593.json?diag=$stamp"
          probe STATICROOT "https://www.powerpc-darwin.org/static/ppc-static-root-diag.json?diag=$stamp"

          echo PPC_EXTERNAL_DIAG_END
