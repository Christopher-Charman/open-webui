name: OpenWebUI scoped theme build

on:
  push:
    branches:
      - theme/telemetry-live-phase-20261011

permissions:
  contents: read

concurrency:
  group: scoped-theme-telemetry-20261011
  cancel-in-progress: false

jobs:
  build-verified-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install frozen dependencies
        run: npm ci --force --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Test shell activity state
        run: npx vitest run src/lib/custom-shell/state/openWebUiState.test.ts --pool=forks --maxWorkers=1 --minWorkers=1

      - name: Production frontend build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=5120

      - name: Record exact build provenance and hashes
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("build")
          assert (root / "index.html").is_file(), "Missing production frontend index"
          files = {}
          for path in sorted(root.rglob("*")):
              assert not path.is_symlink(), f"Unexpected symlink: {path}"
              if path.is_file():
                  rel = path.relative_to(root).as_posix()
                  files[rel] = {
                      "bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
          assert len(files) >= 4000, f"Incomplete frontend: {len(files)} files"
          manifest = {
              "schema": "openwebui-frontend-artifact-v1",
              "commit": os.environ["GITHUB_SHA"],
              "files": files,
              "file_count": len(files),
          }
          (root / ".release-manifest.json").write_text(json.dumps(manifest, sort_keys=True))
          print("Built", len(files), "files from", manifest["commit"])
          print("Index SHA256", files["index.html"]["sha256"])
          PY

      - name: Upload verified frontend only
        uses: actions/upload-artifact@v4
        with:
          name: openwebui-frontend-${{ github.sha }}
          path: build/
          retention-days: 1
          compression-level: 6
          include-hidden-files: true
          if-no-files-found: error
