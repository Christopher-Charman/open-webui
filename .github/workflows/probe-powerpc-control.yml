name: Probe PowerPC Terminal Control

on:
  push:
    paths:
      - ".github/workflows/probe-powerpc-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe terminal session creation
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/create.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"cols":100,"rows":30}' https://www.powerpc-darwin.org/terminal/api/session || true)"
          echo "TERMINAL_CREATE_HTTP=$code"
          if [ "$code" = "200" ]; then
            python3 -c 'import json; d=json.load(open("/tmp/create.json")); assert d.get("ok") is True; assert isinstance(d.get("session_id"),str) and d["session_id"]; assert isinstance(d.get("csrf_token"),str) and d["csrf_token"]'
            echo "TERMINAL_MACHINE_CALLABLE=PASS"
          elif [ "$code" = "409" ]; then
            echo "TERMINAL_MACHINE_CALLABLE=SESSION_EXISTS"
          elif [ "$code" = "403" ]; then
            echo "TERMINAL_MACHINE_CALLABLE=GATE_REQUIRED"
          else
            echo "TERMINAL_MACHINE_CALLABLE=FAIL"
          fi
