name: Provider SSH Host-Key Census

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/provider-ssh-hostkey-census.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provider-ssh-hostkey-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Scan provider SSH host keys
        shell: bash
        run: |
          set -euo pipefail
          out="bootstrap-relay/permanent-control/provider-ssh-hostkeys.txt"
          tmp="$(mktemp)"
          : >"$tmp"
          for target in "77.68.64.22:22" "77.68.64.22:1022" "213.171.193.5:22"; do
            host="${target%:*}"
            port="${target##*:}"
            echo "HOST=$host PORT=$port" >>"$tmp"
            if keys="$(ssh-keyscan -T 15 -p "$port" -t ed25519,ecdsa,rsa "$host" 2>/dev/null)"; then
              if [ -n "$keys" ]; then
                while IFS= read -r line; do
                  [ -n "$line" ] || continue
                  printf '%s\n' "$line" | ssh-keygen -lf - >>"$tmp"
                done <<<"$keys"
              else
                echo "NO_KEY_RETURNED" >>"$tmp"
              fi
            else
              echo "SCAN_FAILED" >>"$tmp"
            fi
          done
          mkdir -p "$(dirname "$out")"
          mv "$tmp" "$out"

      - name: Persist census
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Gateway Host-Key Census"
          git config user.email "61332783+Christopher-Charman@users.noreply.github.com"
          git add bootstrap-relay/permanent-control/provider-ssh-hostkeys.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "diagnostics(gateway): record provider SSH host keys [skip ci]"
          git push origin HEAD:main
