name: OpenWebUI pinned frontend build

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character source commit SHA
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: openwebui-pinned-frontend-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate exact source commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1

      - name: Checkout pinned theme source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Verify source identity
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frozen dependencies
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: npm ci --force --no-audit --no-fund

      - name: Frontend regression tests
        run: npx vitest run --pool=forks --maxWorkers=1 --minWorkers=1

      - name: Production frontend build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENWEBUI_RESOURCE_CONSTRAINED_BUILD: '1'
        run: npm run build

      - name: Manifest and archive
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path("build")
          assert (root/"index.html").is_file()
          files={}
          for p in sorted(root.rglob("*")):
              assert not p.is_symlink(), f"Unexpected build symlink: {p}"
              if p.is_file():
                  files[p.relative_to(root).as_posix()]={"size":p.stat().st_size,
                    "sha256":hashlib.sha256(p.read_bytes()).hexdigest()}
          assert len(files)>=4500, f"Incomplete frontend: {len(files)}"
          assert any(name.startswith("_app/immutable/") for name in files)
          result={"schema":"openwebui-frontend-build-v1","commit":os.environ["SOURCE_COMMIT"],
                  "file_count":len(files),"files":files}
          Path("frontend-manifest.json").write_text(json.dumps(result,sort_keys=True))
          print("Built",len(files),"files; index SHA-256",files["index.html"]["sha256"])
          PY
          tar -czf frontend.tar.gz -C build .

      - name: Create draft release without Actions artifact storage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          tag="owui-theme-build-20261011-${SOURCE_COMMIT:0:12}"
          if gh release view "$tag" -R "$GH_REPO" >/dev/null 2>&1; then
            echo "Existing release; refusing overwrite."
            exit 1
          fi
          gh release create "$tag" frontend.tar.gz frontend-manifest.json \
            --repo "$GH_REPO" --target "$SOURCE_COMMIT" --draft \
            --title "Pinned OpenWebUI frontend ${SOURCE_COMMIT:0:12}" \
            --notes "Temporary deployment-transfer build from pinned source. Not production acceptance."
