name: Release to PyPI

on:
  push:
    branches:
      - main # or whatever branch you want to use
      - pypi-release
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'

jobs:
  version_gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify main version bump or explicit release branch
        id: check
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == 'refs/heads/pypi-release' ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            bash .github/scripts/version-transition.sh "$BEFORE_SHA" >> "$GITHUB_OUTPUT"
            if grep -Fxq 'changed=true' "$GITHUB_OUTPUT"; then
              echo 'publish=true' >> "$GITHUB_OUTPUT"
            else
              echo 'publish=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [version_gate]
    if: needs.version_gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/open-webui
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Git
        run: sudo apt-get update && sudo apt-get install -y git
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: 3.11
      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build .
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
