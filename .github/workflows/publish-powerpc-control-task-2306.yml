name: Publish PowerPC owned-control task
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-powerpc-control-task-2306.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize encrypted task blob
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,urllib.request
          url="https://api.github.com/repos/Christopher-Charman/open-webui/git/blobs/95874b5616a39c490ea7aaf7065f2c9b9475836b"
          with urllib.request.urlopen(url,timeout=30) as r:
              d=json.load(r)
          raw=base64.b64decode(d["content"])
          open("bootstrap-relay/permanent-control/queue.json","wb").write(raw)
          PY
          git config user.name "PowerPC Control Publisher"
          git config user.email "61332783+Christopher-Charman@users.noreply.github.com"
          git add bootstrap-relay/permanent-control/queue.json
          git commit -m "control: publish encrypted public-route repair task"
          git push origin HEAD:main
