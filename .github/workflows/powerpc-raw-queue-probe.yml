name: PowerPC raw queue propagation probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/powerpc-raw-queue-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify raw main queue head
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/Christopher-Charman/open-webui/main/bootstrap-relay/permanent-control/queue.json"
          expected="ppc-health-valid-1790727010"
          for i in $(seq 1 12); do
            curl -fsSL -H 'Cache-Control: no-cache' "$url?probe=$(date +%s%N)" -o /tmp/q.json
            got="$(python3 - <<'PY'
          import json
          q=json.load(open('/tmp/q.json'))
          print(','.join(t.get('task_id','') for t in q.get('tasks',[])))
          PY
          )"
            echo "attempt=$i tasks=$got"
            case ",$got," in
              *",$expected,"*) echo "RAW_QUEUE_CURRENT=PASS"; exit 0 ;;
            esac
            sleep 5
          done
          echo "RAW_QUEUE_CURRENT=FAIL" >&2
          exit 1
