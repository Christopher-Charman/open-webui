name: PowerPC public route probe
on:
  push:
    branches: [main]
    paths:
      - bootstrap-relay/permanent-control/queue.json
      - .github/workflows/powerpc-control-public-route-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Strict protocol probe
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://www.powerpc-darwin.org/ppc-control-identity.json"
            "https://www.powerpc-darwin.org/wiki/ppc-control-identity.json"
            "https://www.powerpc-darwin.org/static/powerpc-control-v1/identity.json"
            "https://www.powerpc-darwin.org/.well-known/powerpc-control-v1/identity.json"
            "https://www.powerpc-darwin.org/powerpc-control-v1/identity.json"
          )
          for round in 1 2 3; do
            for url in "${urls[@]}"; do
              code="$(curl -sS -o /tmp/body -D /tmp/headers -w '%{http_code}' --connect-timeout 6 --max-time 12 "$url?t=$(date +%s%N)" || true)"
              ctype="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); print substr($0,index($0,":")+2)}' /tmp/headers | tail -n1)"
              echo "round=$round http=$code content_type=${ctype:-none} url=$url"
              if [ "$code" = "200" ] && python3 - /tmp/body <<'PY'
          import json,sys,time
          try:
              d=json.load(open(sys.argv[1]))
          except Exception:
              raise SystemExit(1)
          assert d.get("protocol")=="powerpc-control-v1"
          assert d.get("version")==1
          assert d.get("runtime_id")=="fasthost.powerpc"
          assert d.get("state")=="ready"
          assert d.get("uid")==2257347
          assert d.get("user")=="csh3280350"
          assert d.get("hostname")=="hp3-rr-1024747.hostingp3.local"
          assert set(d.get("tool_contract",[]))=={"runtime_health","read_text","list_dir","terminal_exec"}
          assert int(time.time())-int(d.get("heartbeat_at",0)) < 240
          PY
              then
                echo "POWERPC_PUBLIC_PROTOCOL_JSON=PASS url=$url"
                exit 0
              fi
            done
            sleep 2
          done
          echo "POWERPC_PUBLIC_PROTOCOL_JSON=FAIL" >&2
          exit 1
