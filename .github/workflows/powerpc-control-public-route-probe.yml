name: PowerPC public route probe
on:
  push:
    branches: [main]
    paths:
      - bootstrap-relay/permanent-control/queue.json
      - .github/workflows/powerpc-control-public-route-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Strict protocol probe
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.powerpc-darwin.org/ppc-control-identity.json"
          for i in $(seq 1 40); do
            code="$(curl -sS -o /tmp/identity.json -w '%{http_code}' --connect-timeout 8 --max-time 15 "$URL?t=$(date +%s%N)" || true)"
            echo "attempt=$i http=$code"
            if [ "$code" = "200" ]; then
              if python3 - /tmp/identity.json <<'PY'
          import json,sys,time
          d=json.load(open(sys.argv[1]))
          assert d.get("protocol")=="powerpc-control-v1"
          assert d.get("version")==1
          assert d.get("runtime_id")=="fasthost.powerpc"
          assert d.get("state")=="ready"
          assert d.get("uid")==2257347
          assert d.get("user")=="csh3280350"
          assert d.get("hostname")=="hp3-rr-1024747.hostingp3.local"
          assert set(d.get("tool_contract",[]))=={"runtime_health","read_text","list_dir","terminal_exec"}
          assert int(time.time())-int(d.get("heartbeat_at",0)) < 180
          PY
              then
                echo "POWERPC_PUBLIC_PROTOCOL_JSON=PASS"
                exit 0
              fi
              echo "body was HTTP 200 but not valid PowerPC protocol JSON"
              head -c 160 /tmp/identity.json || true
              echo
            fi
            sleep 5
          done
          echo "POWERPC_PUBLIC_PROTOCOL_JSON=FAIL" >&2
          exit 1
