name: PowerPC public route probe
on:
  push:
    branches: [main]
    paths:
      - bootstrap-relay/permanent-control/queue.json
      - .github/workflows/powerpc-control-public-route-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Strict protocol probe
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://www.powerpc-darwin.org/static"
          for round in 1 2 3 4 5 6; do
            for n in 0 1 2 3 4 5 6 7; do
              code="$(curl -sS -o /tmp/keyprobe -w '%{http_code}' --connect-timeout 6 --max-time 12 "$BASE/ppc-keyprobe-$n.json?t=$(date +%s%N)" || true)"
              if [ "$code" = "200" ] && python3 - /tmp/keyprobe "$n" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get("protocol")=="powerpc-control-keyprobe-v1"
          assert d.get("probe")==int(sys.argv[2])
          PY
              then
                echo "POWERPC_X25519_CANDIDATE=$n"
                curl -fsS --connect-timeout 6 --max-time 12 "$BASE/powerpc-control-identity.json?t=$(date +%s%N)" -o /tmp/identity.json
                python3 - /tmp/identity.json <<'PY'
          import json,sys,time
          d=json.load(open(sys.argv[1]))
          assert d.get("protocol")=="powerpc-control-v1"
          assert d.get("version")==1
          assert d.get("runtime_id")=="fasthost.powerpc"
          assert d.get("state")=="ready"
          assert d.get("uid")==2257347
          assert d.get("user")=="csh3280350"
          assert d.get("hostname")=="hp3-rr-1024747.hostingp3.local"
          assert set(d.get("tool_contract",[]))=={"runtime_health","read_text","list_dir","terminal_exec"}
          assert int(time.time())-int(d.get("heartbeat_at",0)) < 240
          PY
                echo "POWERPC_PUBLIC_PROTOCOL_JSON=PASS"
                exit 0
              fi
            done
            sleep 2
          done
          echo "POWERPC_PUBLIC_PROTOCOL_JSON=FAIL" >&2
          exit 1
