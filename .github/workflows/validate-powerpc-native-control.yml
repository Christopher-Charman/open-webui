name: Validate PowerPC Native Control

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-powerpc-native-control.yml"

permissions:
  contents: write

concurrency:
  group: powerpc-native-control-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install crypto dependency
        run: python3 -m pip install --disable-pip-version-check --quiet cryptography

      - name: Issue canonical encrypted validation task
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PowerPC Native Acceptance"
          git config user.email "61332783+Christopher-Charman@users.noreply.github.com"

          python3 - <<'PY'
          import base64, json, os, time
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import x25519
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF

          def b64e(b):
              return base64.urlsafe_b64encode(b).decode("ascii").rstrip("=")
          def canon(o):
              return json.dumps(o, sort_keys=True, separators=(",",":"), ensure_ascii=False).encode()
          def derive(shared, task_id, purpose):
              return HKDF(
                  algorithm=hashes.SHA256(),
                  length=32,
                  salt=task_id.encode(),
                  info=b"powerpc-control-v1/" + purpose,
              ).derive(shared)

          runtime_raw = bytes.fromhex("61c8a515978b84457cda13437ec82b69d82994c0f83052660bf458954993297a")
          runtime_pub = x25519.X25519PublicKey.from_public_bytes(runtime_raw)
          origin_priv = x25519.X25519PrivateKey.generate()
          origin_der = origin_priv.public_key().public_bytes(
              serialization.Encoding.DER,
              serialization.PublicFormat.SubjectPublicKeyInfo,
          )
          shared = origin_priv.exchange(runtime_pub)

          now = int(time.time())
          task_id = "native-canonical-" + os.environ["GITHUB_RUN_ID"]
          task = {
              "protocol":"powerpc-control-v1",
              "version":1,
              "task_id":task_id,
              "target_runtime_id":"fasthost.powerpc",
              "created_at":now,
              "expires_at":now+600,
              "origin_ephemeral_x25519_spki_b64":b64e(origin_der),
          }

          command = f"""set -eu
          P=/home/storage/781/4477781/user
          WEBAPP="$P/webapp"
          STATIC="$("$WEBAPP/envs/openwebui/bin/python3" -c 'import open_webui,os; print(os.path.join(os.path.dirname(open_webui.__file__),"static"))')"
          cp "$P/htdocs/.well-known/powerpc-control-v1/identity.json" "$STATIC/ppc-control-identity.json"
          mkdir -p "$STATIC/ppc-control-results"
          printf '%s\n' '{{"protocol":"powerpc-control-v1","runtime_id":"fasthost.powerpc","proof":"canonical_envelope_decrypted","task_id":"{task_id}"}}' > "$STATIC/ppc-control-proof.json"
          EG="$P/.powerpc-control-v1/acceptance-egress.sh"
          cat > "$EG" <<EOF
          #!/bin/sh
          SRC="$P/htdocs/.well-known/powerpc-control-v1/results"
          DST="$STATIC/ppc-control-results"
          END=\$((\$(date +%s)+900))
          while [ \$(date +%s) -lt \$END ]; do
            for f in "\$SRC"/*.json; do
              [ -f "\$f" ] || continue
              cp "\$f" "\$DST/\$(basename "\$f")"
            done
            sleep 1
          done
          EOF
          chmod 700 "$EG"
          nohup "$EG" >/dev/null 2>&1 </dev/null &
          printf 'NATIVE_CANONICAL_EGRESS_PASS\n'
          printf 'STATIC=%s\n' "$STATIC"
          """
          payload = {
              "task_id":task_id,
              "target_runtime_id":"fasthost.powerpc",
              "tool":"terminal_exec",
              "arguments":{"command":command,"timeout_ms":10000},
              "authority_ceiling":"bounded_operator",
              "allowed_capability_profile":["terminal_exec"],
              "expected_result_schema":"assistant-delegation-receipt-v1",
          }
          aad = canon(task)
          nonce = os.urandom(12)
          cipher = AESGCM(derive(shared, task_id, b"command")).encrypt(nonce, canon(payload), aad)
          task["nonce_b64"] = b64e(nonce)
          task["ciphertext_b64"] = b64e(cipher)

          queue = {"protocol":"powerpc-control-v1","version":1,"tasks":[task]}
          Path("bootstrap-relay/permanent-control/queue.json").write_text(
              json.dumps(queue, sort_keys=True, separators=(",",":"))+"\n"
          )
          Path("/tmp/native-context.json").write_text(json.dumps({
              "task_id":task_id,
              "shared_secret_b64":b64e(shared),
          }))
          Path("/tmp/task-id").write_text(task_id)
          print("CANONICAL_TASK_PREPARED="+task_id)
          PY

          git add bootstrap-relay/permanent-control/queue.json
          git commit -m "control: issue canonical native acceptance task"
          git push origin HEAD:main

      - name: Verify execution proof and signed encrypted receipt
        shell: bash
        run: |
          set -euo pipefail
          id="$(cat /tmp/task-id)"
          proof_url="https://www.powerpc-darwin.org/static/ppc-control-proof.json"
          identity_url="https://www.powerpc-darwin.org/static/ppc-control-identity.json"
          result_url="https://www.powerpc-darwin.org/static/ppc-control-results/$id.json"

          for i in $(seq 1 60); do
            if curl -fsS --connect-timeout 8 --max-time 15 "$proof_url?t=$(date +%s%N)" -o /tmp/proof.json; then
              if python3 - /tmp/proof.json "$id" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get("protocol")=="powerpc-control-v1"
          assert d.get("runtime_id")=="fasthost.powerpc"
          assert d.get("proof")=="canonical_envelope_decrypted"
          assert d.get("task_id")==sys.argv[2]
          PY
              then
                echo "CANONICAL_DECRYPT_AND_EXECUTION=PASS"
                break
              fi
            fi
            [ "$i" -lt 60 ] || { echo "CANONICAL_DECRYPT_AND_EXECUTION=FAIL"; exit 1; }
            sleep 2
          done

          curl -fsS "$identity_url?t=$(date +%s%N)" -o /tmp/identity.json

          for i in $(seq 1 60); do
            if curl -fsS --connect-timeout 8 --max-time 15 "$result_url?t=$(date +%s%N)" -o /tmp/result.json; then
              break
            fi
            [ "$i" -lt 60 ] || { echo "SIGNED_RECEIPT_RETRIEVAL=FAIL"; exit 1; }
            sleep 2
          done

          python3 - <<'PY'
          import base64, hashlib, json
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ed25519
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF

          def b64d(s):
              return base64.urlsafe_b64decode((s+"="*(-len(s)%4)).encode())
          def canon(o):
              return json.dumps(o,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
          def derive(shared,task_id,purpose):
              return HKDF(
                  algorithm=hashes.SHA256(),length=32,
                  salt=task_id.encode(),
                  info=b"powerpc-control-v1/"+purpose
              ).derive(shared)

          ident=json.load(open("/tmp/identity.json"))
          assert ident["protocol"]=="powerpc-control-v1"
          assert ident["runtime_id"]=="fasthost.powerpc"
          assert ident["uid"]==2257347
          assert ident["user"]=="csh3280350"
          assert ident["hostname"]=="hp3-rr-1024747.hostingp3.local"

          xder=b64d(ident["x25519_spki_b64"])
          eder=b64d(ident["ed25519_spki_b64"])
          expected_x=bytes.fromhex("61c8a515978b84457cda13437ec82b69d82994c0f83052660bf458954993297a")
          xpub=serialization.load_der_public_key(xder)
          raw=xpub.public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          assert raw==expected_x

          fp="SHA256:"+base64.b64encode(hashlib.sha256(xder+eder).digest()).decode().rstrip("=")
          assert ident["identity_fingerprint"]==fp

          epub=serialization.load_der_public_key(eder)
          signed=dict(ident); isig=b64d(signed.pop("signature_b64"))
          epub.verify(isig,canon(signed))
          print("RUNTIME_IDENTITY_SIGNATURE_AND_FINGERPRINT=PASS")

          result=json.load(open("/tmp/result.json"))
          ctx=json.load(open("/tmp/native-context.json"))
          assert result["task_id"]==ctx["task_id"]
          assert result["protocol"]=="powerpc-control-v1"
          assert result["target_runtime_id"]=="fasthost.powerpc"
          assert result["kind"]=="result"

          signed_result=dict(result)
          rsig=b64d(signed_result.pop("signature_b64"))
          epub.verify(rsig,canon(signed_result))
          print("RESULT_SIGNATURE=PASS")

          aad=canon({
              "protocol":"powerpc-control-v1",
              "version":1,
              "task_id":ctx["task_id"],
              "target_runtime_id":"fasthost.powerpc",
              "kind":"result",
          })
          plain=AESGCM(derive(b64d(ctx["shared_secret_b64"]),ctx["task_id"],b"result")).decrypt(
              b64d(result["nonce_b64"]),b64d(result["ciphertext_b64"]),aad
          )
          receipt=json.loads(plain)
          assert receipt["task_id"]==ctx["task_id"]
          assert receipt["completion_state"]=="COMPLETED"
          ex=receipt["executor_identity"]
          assert ex["runtime_id"]=="fasthost.powerpc"
          assert ex["uid"]==2257347
          assert ex["user"]=="csh3280350"
          assert ex["hostname"]=="hp3-rr-1024747.hostingp3.local"
          text="\n".join(
              x.get("text","") for x in receipt.get("result",{}).get("content",[])
              if isinstance(x,dict)
          )
          assert "NATIVE_CANONICAL_EGRESS_PASS" in text
          print("SIGNED_ENCRYPTED_RECEIPT_DECRYPTION=PASS")
          print("NATIVE_TERMINAL_EXEC=PASS")
          print("POWERPC_NATIVE_CONTROL_STAGE1=PASS")
          PY
