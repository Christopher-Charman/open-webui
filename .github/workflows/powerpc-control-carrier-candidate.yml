name: powerpc-control-carrier-candidate

on:
  push:
    branches:
      - tooling/powerpc-control-carrier-hardening
    paths:
      - .github/workflows/powerpc-control-carrier-candidate.yml
      - bootstrap-relay/permanent-control/daemon.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tooling/powerpc-control-carrier-hardening
      - name: Validate immutable-SHA queue carrier candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bootstrap-relay/permanent-control/daemon.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path("bootstrap-relay/permanent-control/daemon.py").read_text()
          assert 'QUEUE_REF_CHECK_SECONDS' in s
          assert '"90"' in s
          assert '/commits/main' in s
          assert 'QUEUE_SHA_URL_TEMPLATE.format(sha=' in s
          assert '"immutable_sha"' in s
          assert '"mutable_fallback"' in s
          assert 'X-RateLimit-Remaining' in s
          assert 'str(time.time_ns())' not in s
          assert '"Cache-Control": "no-cache"' not in s
          assert '"Pragma": "no-cache"' not in s
          print("IMMUTABLE_SHA_CARRIER_SOURCE_VALIDATION=PASS")
          PY
